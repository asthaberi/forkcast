spring:
  application:
    name: forkcast

  # Java 21 virtual threads: every request runs on a cheap virtual thread,
  # so blocking calls (MongoDB, Redis, LLM APIs) don't exhaust a thread pool.
  threads:
    virtual:
      enabled: true

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/forkcast}

  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

forkcast:
  # Business time zone for open/peak hours, independent of the server's zone.
  time-zone: Asia/Kolkata
  seed:
    enabled: ${SEED_ENABLED:true}
  search:
    normal-radius-km: 5
    # Smaller radius at peak times keeps delivery times short when demand is high.
    peak-radius-km: 3
    peak-windows:
      - { start-hour: 8, end-hour: 10 }
      - { start-hour: 13, end-hour: 14 }
      - { start-hour: 19, end-hour: 21 }
