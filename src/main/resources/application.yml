spring:
  application:
    name: forkcast

  # Java 21 virtual threads: every request runs on a cheap virtual thread,
  # so blocking calls (MongoDB, Redis, LLM APIs) don't exhaust a thread pool.
  threads:
    virtual:
      enabled: true

  mongodb:
    # directConnection: talk to the single replica-set member directly, whatever host name it advertises
    uri: ${MONGODB_URI:mongodb://localhost:27017/forkcast?directConnection=true}

  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast if Redis is down so the request can fall back to MongoDB (see CacheConfig).
      timeout: 500ms
      connect-timeout: 500ms

  cache:
    # "none" disables caching entirely (used for the before/after benchmark).
    type: ${CACHE_TYPE:redis}

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    # Keeps the pasted token across page reloads
    persist-authorization: true
    tags-sorter: alpha
  # Only document the API itself, not actuator or error endpoints
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

forkcast:
  # Business time zone for open/peak hours, independent of the server's zone.
  time-zone: Asia/Kolkata
  rate-limit:
    # false turns all limits off, e.g. for load tests sent from one machine
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Token buckets: up to `capacity` requests in a burst, refilled at refill-tokens per refill-period.
    policies:
      api:                # every /api request, per user (or per IP when signed out)
        capacity: 200
        refill-tokens: 200
        refill-period: 1m
      login:              # per IP
        capacity: 10
        refill-tokens: 10
        refill-period: 1m
      login-account:      # per email, whatever IP the attempts come from
        capacity: 10
        refill-tokens: 10
        refill-period: 15m
      register:           # per IP
        capacity: 5
        refill-tokens: 5
        refill-period: 1h
      place-order:        # per user
        capacity: 10
        refill-tokens: 10
        refill-period: 1m
  security:
    jwt:
      # Local-development fallback only. Always set JWT_SECRET (32+ random bytes) anywhere else.
      secret: ${JWT_SECRET:dev-only-forkcast-jwt-secret-change-me-0123456789}
      issuer: forkcast
      access-token-ttl: 60m
  seed:
    enabled: ${SEED_ENABLED:true}
    # Demo accounts for local development, created only when seeding is enabled.
    # The owner account is linked to the restaurant named in "owns".
    users:
      - name: Forkcast Admin
        email: admin@forkcast.example
        password: ${SEED_ADMIN_PASSWORD:admin-dev-password}
        roles: [ADMIN]
      - name: Dosa Junction Owner
        email: owner@forkcast.example
        password: ${SEED_OWNER_PASSWORD:owner-dev-password}
        roles: [RESTAURANT_OWNER]
        owns: Dosa Junction
      - name: Demo Customer
        email: customer@forkcast.example
        password: ${SEED_CUSTOMER_PASSWORD:customer-dev-password}
        roles: [CUSTOMER]
  cache:
    menu-ttl: 30m
    nearby-ttl: 5m
  pricing:
    delivery-fee: 30.00
    free-delivery-threshold: 499.00
    # GST on restaurant food in India
    tax-rate: 0.05
  search:
    # Geohash length for grouping nearby users into one cache entry (7 = ~153 m x 153 m cells).
    cell-precision: 7
    normal-radius-km: 5
    # Smaller radius at peak times keeps delivery times short when demand is high.
    peak-radius-km: 3
    peak-windows:
      - { start-hour: 8, end-hour: 10 }
      - { start-hour: 13, end-hour: 14 }
      - { start-hour: 19, end-hour: 21 }
