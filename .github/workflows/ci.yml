name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    # Temporarily on Ubuntu 22.04 (Linux 6.8): the 24.04 image moved to Linux 7.0, where MongoDB 8.0.34 refuses
    # to start (SERVER-121912; its kernel check misreads Ubuntu's version, SERVER-131779). Back to ubuntu-latest
    # once the mongo:8.0 image has the fix (8.0.35+), which the "MongoDB on the newest runner" job below shows.
    # 22.04 brownouts start March 2027 (actions/runner-images#14254).
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Fails in seconds with MongoDB's own error if it can't start here, instead of every
      # integration test class timing out with the reason buried in the log
      - name: Check MongoDB starts on this runner
        run: .github/scripts/check-mongo-starts.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit, web-slice and integration tests. Integration tests start MongoDB and Redis with
      # Testcontainers, using the Docker engine that GitHub's Ubuntu runners provide.
      - name: Test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

      # The API contract generated by OpenApiSpecTest, attached to every run
      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: target/openapi.json

  # Doesn't block anything: shows whether the tests could move back to the newest runner image.
  # Red while MongoDB can't start on its kernel; once green, set the test job back to ubuntu-latest.
  mongo-canary:
    name: MongoDB on the newest runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # While GitHub rolls out a new image, a run can still land on the old one: green only counts
      # on a kernel of 6.19 or newer
      - name: Check MongoDB starts on this runner
        run: |
          echo "::notice title=Runner kernel::$(uname -r)"
          .github/scripts/check-mongo-starts.sh

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Pushed only from main; pull requests just check that the image builds
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/forkcast
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers from earlier runs (e.g. the dependency layer when only code changed)
          cache-from: type=gha
          cache-to: type=gha,mode=max
